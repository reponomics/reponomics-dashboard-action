# This workflow uses an action that is not certified by GitHub. It is provided
# by a third party and is governed by separate terms of service, privacy policy,
# and support documentation.

name: Bandit static analysis

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "36 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: Bandit scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run Bandit scan
        uses: shundor/python-bandit-scan@9955228c1cbdc5aeb5e511e0fa232154e2ed2b67 # main, 2026-07-29
        with:
          # Let the action upload SARIF before the following step enforces the result.
          exit_zero: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          path: dashboard_action scripts

      - name: Enforce clean Bandit result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("results.sarif").read_text(encoding="utf-8"))
          findings = sum(len(run.get("results", [])) for run in report.get("runs", []))
          if findings:
              raise SystemExit(
                  f"Bandit reported {findings} finding(s); review the uploaded SARIF report."
              )
          PY
