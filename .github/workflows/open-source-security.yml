name: Open source security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "47 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-runtime.txt
            requirements-guide-tooling.in
            requirements-guide-tooling.txt
            requirements-analysis.in
            requirements-analysis.txt

      - name: Audit installed Python dependencies
        run: make security-audit

      - name: Audit runtime dependency lock
        run: make audit-runtime-lock

      - name: Audit guide tooling dependency lock
        run: make audit-guide-tooling-lock

      - name: Audit static-analysis dependency lock
        run: make audit-analysis-lock

      - name: Validate guide tooling dependency lock
        run: make validate-guide-tooling-lock

      - name: Validate static-analysis dependency lock
        run: make validate-analysis-lock
