name: Pre-release Validation

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git ref to validate"
        required: true
        type: string
        default: main

permissions:
  contents: read

# Candidate code must not write to the default branch's shared caches.
cache-mode: read

concurrency:
  group: pre-release-validation-${{ inputs.source_ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"

jobs:
  action-template:
    name: Validate action and generated template together
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate action and workflow metadata
        run: |
          set -euo pipefail
          make validate

      - name: Build and smoke-test generated template
        run: |
          set -euo pipefail
          make verify-workflow-classification
          make validate-template-action-ref
          make template-smoke

      - name: Run generated template compatibility against candidate action
        run: |
          set -euo pipefail
          make template-compat-e2e

      - name: Dry-run generated template publication
        run: |
          set -euo pipefail
          make publish-template-dry-run

      - name: Upload generated template artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-template-${{ github.run_id }}
          path: dist/template
          if-no-files-found: warn
          retention-days: 7
